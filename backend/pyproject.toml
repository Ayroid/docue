[project]
name = "templatehub-backend"
version = "0.1.0"
description = "Backend for Ymsli Hackethon"
authors = [
    { name = "ayroid", email = "ayushsk0000@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "boto3>=1.43.70",
    "certifi>=2026.7.22",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites shell out to `scripts/test_*.py`, which print reports worth reading.
# `-ra` surfaces the skip reasons -- a skipped suite means a corpus file is
# missing on this machine, and that should never pass by unnoticed.
addopts = "-ra"
