# Pinned so the volume names never depend on what the checkout directory is
# called. Without this, Compose derives the project name from the directory,
# and renaming or moving the repo silently starts a fresh, empty database
# instead of reusing the existing one.
name: docue

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadm
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: docue
      POSTGRES_PASSWORD: docue
      POSTGRES_DB: docue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docue -d docue"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  minio_data:
  postgres_data: